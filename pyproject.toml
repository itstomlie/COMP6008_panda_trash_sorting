[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panda-trash-gym"
version = "0.1.0"
description = "Gymnasium environment: a Franka Panda sorts trash into bins in MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.3,<4",
    "mujoco-menagerie==2026.9.2",
    "gymnasium>=1.0,<2",
    "numpy",
]

[project.optional-dependencies]
train = ["stable-baselines3>=2.4,<3", "tensorboard>=2.18", "matplotlib>=3.9"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["envs*", "controllers*", "assets*"]
